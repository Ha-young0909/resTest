<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; background: transparent; font-family: sans-serif; }
  #wrap { max-width: 900px; margin: 0 auto; }
  canvas { width: 100%; display: block; border-bottom: 1px solid #ddd; outline: none; cursor: pointer; image-rendering: pixelated; }
  #hint { text-align: center; color: #888; font-size: 13px; margin-top: 6px; }
  #themes { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  #themes button { padding: 6px 14px; border: 1px solid #bbb; border-radius: 16px; background: #fff; color: #535353; font: 13px sans-serif; cursor: pointer; }
  #themes button[aria-pressed="true"] { background: #535353; color: #fff; border-color: #535353; }
  #board { display: none; margin-top: 14px; padding: 12px 16px; background: #f7f7f7; color: #535353; border: 1px solid #ddd; border-radius: 6px; }
  #board h3 { margin: 0 0 8px; font-size: 15px; }
  #board h3 small { font-weight: normal; color: #888; font-size: 12px; margin-left: 6px; }
  #nameRow { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; font-size: 13px; }
  #nameRow input { flex: 1; max-width: 180px; padding: 4px 8px; border: 1px solid #bbb; border-radius: 4px; font: inherit; color: inherit; background: #fff; }
  #status { color: #888; font-size: 12px; margin-bottom: 8px; min-height: 16px; }
  #rows { list-style: none; margin: 0; padding: 0; font: 14px monospace; }
  #rows li { display: flex; gap: 10px; padding: 3px 4px; border-bottom: 1px solid #eee; }
  #rows li.me { background: #ececec; font-weight: bold; }
  #rows .rank { width: 28px; text-align: right; color: #888; }
  #rows .nick { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rows .pts { width: 60px; text-align: right; }
  #rows .empty { color: #888; justify-content: center; border: 0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="600" height="150" tabindex="0"></canvas>
  <div id="hint">스페이스 / ↑ : 점프 &nbsp;·&nbsp; ↓ : 숙이기(공중에선 빨리 내려오기) &nbsp;·&nbsp; 화면 터치/클릭도 가능</div>
  <div id="themes" role="group" aria-label="테마">
    <button type="button" data-theme="basic" aria-pressed="true">기본</button>
    <button type="button" data-theme="biglight" aria-pressed="false">빅라이트</button>
  </div>
  <div id="board">
    <h3>오늘의 TOP 10<small>매일 자정(KST)에 초기화</small></h3>
    <div id="nameRow">
      <label for="nick">닉네임</label>
      <input id="nick" maxlength="12" placeholder="최대 12자" autocomplete="off">
    </div>
    <div id="status"></div>
    <ol id="rows"></ol>
  </div>
</div>

  function imgReady(i) { return i.complete && i.naturalWidth > 0; }

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");

  function setTheme(id) {
    if (!THEMES[id]) id = "basic";
    theme = THEMES[id]; INK = theme.ink; PAPER = theme.paper;
    Array.prototype.forEach.call(document.querySelectorAll("#themes button"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-theme") === id ? "true" : "false");
    });
    try { localStorage.setItem("dinoTheme", id); } catch (e) {}
    if (typeof state !== "undefined") reset();  // 장애물 모양이 테마마다 달라서 판을 새로 시작한다
  }
  Array.prototype.forEach.call(document.querySelectorAll("#themes button"), function (b) {
    b.addEventListener("click", function () { setTheme(b.getAttribute("data-theme")); canvas.focus(); });
  });
  var savedTheme = "basic";
  try { savedTheme = localStorage.getItem("dinoTheme") || "basic"; } catch (e) {}
  setTheme(savedTheme);

  function rand(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
  function rect(x, y, w, h, c) { ctx.fillStyle = c || INK; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
  function overlap(a, b) { return a[0] < b[0] + b[2] && a[0] + a[2] > b[0] && a[1] < b[1] + b[3] && a[1] + a[3] > b[1]; }
  function shift(box, dx, dy) { return [box[0] + dx, box[1] + dy, box[2], box[3]]; }

  var hiScore = 0;
  try { hiScore = parseInt(localStorage.getItem("dinoHi") || "0", 10) || 0; } catch (e) {}

  // ---- 일일 리더보드 (Supabase) ----
  // URL/키는 서버(dino.py)가 치환해 넣는다. 비어 있으면 리더보드 UI를 숨기고 게임만 동작한다.
  var SUPABASE = { url: "__SUPABASE_URL__", key: "__SUPABASE_KEY__" };
  var LB_ENABLED = !!(SUPABASE.url && SUPABASE.key) && SUPABASE.url.indexOf("__") !== 0;
  var LB_LIMIT = 10;
  var boardEl = document.getElementById("board"), rowsEl = document.getElementById("rows");
  var statusEl = document.getElementById("status"), nickEl = document.getElementById("nick");
  var playerName = "", pendingScore = 0;
  try { playerName = (localStorage.getItem("dinoName") || "").trim().slice(0, 12); } catch (e) {}

  function setStatus(msg) { statusEl.textContent = msg || ""; }
  function rpc(fn, args) {
    return fetch(SUPABASE.url + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: { "apikey": SUPABASE.key, "Content-Type": "application/json" },
      body: JSON.stringify(args)
    }).then(function (r) {
      if (!r.ok) throw new Error(fn + " " + r.status);
      return r.json();
    });
  }
  // 닉네임은 사용자 입력이므로 반드시 textContent로만 그린다 (HTML 문자열 삽입 금지).
  function renderBoard(list) {
    rowsEl.textContent = "";
    if (!list.length) {
      var li = document.createElement("li"); li.className = "empty"; li.textContent = "아직 오늘의 기록이 없어요. 첫 번째가 되어보세요!";
      rowsEl.appendChild(li); return;
    }
    list.forEach(function (r) {
      var li = document.createElement("li");
      if (playerName && r.player_name === playerName) li.className = "me";
      [["rank", r.rank], ["nick", r.player_name], ["pts", pad(r.score)]].forEach(function (c) {
        var s = document.createElement("span"); s.className = c[0]; s.textContent = c[1]; li.appendChild(s);
      });
      rowsEl.appendChild(li);
    });
  }
  function loadBoard() {
    if (!LB_ENABLED) return Promise.resolve();
    return rpc("get_dino_daily_leaderboard", { p_limit: LB_LIMIT }).then(renderBoard).catch(function () { setStatus("리더보드를 불러오지 못했어요."); });
  }
  function submitScore(s) {
    if (!LB_ENABLED || s <= 0) return;
    if (!playerName) {
      pendingScore = Math.max(pendingScore, s);
      setStatus("닉네임을 입력하면 " + s + "점이 리더보드에 등록돼요.");
      return;
    }
    setStatus("점수 등록 중...");
    rpc("submit_dino_score", { p_name: playerName, p_score: s })
      .then(function (best) { setStatus(playerName + "님의 오늘 최고 점수: " + best); return loadBoard(); })
      .catch(function () { setStatus("점수를 등록하지 못했어요."); });
  }
  function commitName() {
    var n = nickEl.value.trim().slice(0, 12);
    nickEl.value = n;
    if (!n || n === playerName) return;
    playerName = n;
    try { localStorage.setItem("dinoName", n); } catch (e) {}
    if (pendingScore > 0) { var s = pendingScore; pendingScore = 0; submitScore(s); }
    else loadBoard();
  }
  if (LB_ENABLED) {
    boardEl.style.display = "block";

  var state, trex, obstacles, clouds, groundBumps, speed, distance, runningTime, gameOverAt, time, raf;

  function reset() {

  function endJump() {

    rect(x + 4, y + 18, 28, 18);            // 몸통
    rect(x, y + 20, 6, 8);                  // 꼬리
    rect(x + 32, y + 26, 6, 3);             // 팔
    rect(x + 8, y + 36, 6, leg ? 6 : 11); rect(x + 20, y + 36, 6, leg ? 11 : 6);
    rect(x + 8, y + (leg ? 42 : 46), 10, 1); rect(x + 20, y + (leg ? 46 : 42), 10, 1);
    if (theme.faces) drawFace(x + 31, y + 4, 14);
  }
  function drawFace(cx, cy, r) {
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
    if (imgReady(faceImgs.dino)) ctx.drawImage(faceImgs.dino, cx - r, cy - r, r * 2, r * 2);
    else { ctx.fillStyle = INK; ctx.fillRect(cx - r, cy - r, r * 2, r * 2); }
    ctx.restore();
    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  }

  // ---- 장애물 ----
  function addObstacle() {
    var t, tries = 0, dup;
    do {
      t = OBSTACLES[rand(0, OBSTACLES.length - 1)];
      dup = 0;
      for (var i = obstacles.length - 1; i >= 0 && obstacles[i].t === t; i--) dup++;
      tries++;
    } while ((t.minSpeed > speed || dup >= CFG.MAX_OBSTACLE_DUPLICATION) && tries < 30);
    if (t.minSpeed > speed) t = OBSTACLES[0];
    var size = rand(1, CFG.MAX_OBSTACLE_LENGTH);
    if (size > 1 && t.multipleSpeed > speed) size = 1;
    var width = t.width * size;
    var y = Array.isArray(t.yPos) ? t.yPos[rand(0, t.yPos.length - 1)] : t.yPos;
    var boxes = t.boxes.map(function (b) { return b.slice(); });
    if (size > 1 && boxes.length === 3) {
      boxes[1][2] = width - boxes[0][2] - boxes[2][2];
      boxes[2][0] = width - boxes[2][2];
    }
    if (theme.faces) {  // 얼굴 장애물은 선인장 크기를 따르되 사진 비율(4:5)로 한 개씩만 나온다
      if (t.type === "PTERODACTYL") t = OBSTACLES[rand(0, 1)];
      size = 1; width = Math.round(t.height * 0.8); y = t.yPos;
      boxes = [[3, 3, width - 6, t.height - 3]];
    }
    var base = Math.round(width * speed + t.minGap * CFG.GAP_COEFFICIENT);
    obstacles.push({
      t: t, size: size, width: width, x: W, y: y, boxes: boxes,
      gap: rand(base, Math.round(base * CFG.MAX_GAP_COEFFICIENT)),
      speedOffset: t.speedOffset ? (Math.random() > 0.5 ? t.speedOffset : -t.speedOffset) : 0,
      frame: 0, frameT: 0
    });
  }
  function updateObstacles(dt) {
    for (var i = 0; i < obstacles.length; i++) {
      var o = obstacles[i];
      o.x -= Math.floor((speed + o.speedOffset) * FPS / 1000 * dt);
      if (o.t.frameRate) { o.frameT += dt; if (o.frameT >= o.t.frameRate) { o.frameT = 0; o.frame ^= 1; } }
    }
    obstacles = obstacles.filter(function (o) { return o.x + o.width > 0; });
    var last = obstacles[obstacles.length - 1];
    if (!obstacles.length || (last.x + last.width > 0 && last.x + last.width + last.gap < W)) {
      if (runningTime > CFG.CLEAR_TIME) addObstacle();
    }
  }
  function drawObstacle(o) {
    var C = theme.obstacle;
    if (theme.faces && o.t.type !== "PTERODACTYL") {
      var ox = Math.round(o.x), h0 = o.t.height;
      if (imgReady(faceImgs.ob)) ctx.drawImage(faceImgs.ob, ox, o.y, o.width, h0);
      else rect(o.x, o.y, o.width, h0, C);
      ctx.strokeStyle = C; ctx.lineWidth = 2; ctx.strokeRect(ox + 1, o.y + 1, o.width - 2, h0 - 2);
      return;
    }
    if (o.t.type === "PTERODACTYL") {
      rect(o.x + 12, o.y + 17, 26, 8, C);   // 몸통
      rect(o.x, o.y + 17, 12, 4, C);        // 부리
      rect(o.x + 38, o.y + 18, 8, 3, C);    // 꼬리
      if (o.frame) rect(o.x + 18, o.y + 5, 10, 12, C); else rect(o.x + 18, o.y + 25, 10, 12, C);
      return;
    }
    var h = o.t.height;
    for (var i = 0; i < o.size; i++) {
      var cx = o.x + i * o.t.width + o.t.width / 2;
      rect(cx - 3, o.y, 6, h, C);
      rect(cx - 9, o.y + h * 0.4, 6, 3, C); rect(cx - 9, o.y + h * 0.22, 3, h * 0.2 + 3, C);
      rect(cx + 3, o.y + h * 0.5, 6, 3, C); rect(cx + 6, o.y + h * 0.3, 3, h * 0.2 + 3, C);
    }
  }

  // ---- 충돌 ----
  function collided() {
    var ducking = trex.ducking && !trex.jumping;
    var tb = (ducking ? TREX_BOXES.DUCKING : (theme.faces ? FACE_BOXES : TREX_BOXES.RUNNING)).map(function (b) { return shift(b, TREX.START_X, trex.y); });
    var o = obstacles[0];
    if (!o) return false;
    for (var i = 0; i < tb.length; i++)
      for (var j = 0; j < o.boxes.length; j++)
        if (overlap(tb[i], shift(o.boxes[j], o.x, o.y))) return true;
    return false;
  }

  // ---- 배경 ----
  function updateScenery(dt) {
    var dx = Math.floor(speed * FPS / 1000 * dt);
    groundBumps.forEach(function (b) { b.x -= dx; if (b.x + b.w < 0) { b.x = W + rand(0, 40); b.y = rand(GROUND_Y + TREX.HEIGHT - 1, H - 2); b.w = rand(1, 4); } });
    clouds.forEach(function (c) { c.x -= CFG.BG_CLOUD_SPEED * FPS / 1000 * dt * 10; });
    clouds = clouds.filter(function (c) { return c.x + 46 > 0; });
    var last = clouds[clouds.length - 1];
    if (clouds.length < CFG.MAX_CLOUDS && (!last || W - last.x > rand(100, 400)) && Math.random() < CFG.CLOUD_FREQUENCY * 0.05)
      clouds.push({ x: W, y: rand(30, 71) });
  }
  function drawScenery() {
    clouds.forEach(function (c) { rect(c.x, c.y, 46, 6, theme.cloud); rect(c.x + 8, c.y - 5, 22, 5, theme.cloud); });
    rect(0, GROUND_Y + TREX.HEIGHT - 2, W, 1);
    groundBumps.forEach(function (b) { rect(b.x, b.y, b.w, 1); });
  }

  // ---- 점수 ----
  function score() { return Math.round(distance * CFG.DISTANCE_COEFFICIENT); }
  function pad(n) { var s = String(n); while (s.length < 5) s = "0" + s; return s; }
  var lastMilestone = 0, flashUntil = 0;
  function drawScore() {
    ctx.font = "bold 13px monospace"; ctx.textAlign = "right"; ctx.fillStyle = INK;
    var s = score();
    if (s > 0 && s % CFG.ACHIEVEMENT_DISTANCE === 0 && s !== lastMilestone) { lastMilestone = s; flashUntil = time + 750; }
    var visible = time > flashUntil || Math.floor((flashUntil - time) / 250) % 2 === 1;
    if (visible) ctx.fillText(pad(s), W - 10, 20);
    ctx.fillStyle = theme.hi; ctx.fillText("HI " + pad(hiScore), W - 70, 20);
  }
  function drawCenter(text, y, size) {
    ctx.font = "bold " + size + "px monospace"; ctx.textAlign = "center"; ctx.fillStyle = INK;
    ctx.fillText(text, W / 2, y);
  }

  // ---- 루프 ----
  function crash() {
    state = "crashed"; gameOverAt = time;
    var s = score();
    if (s > hiScore) { hiScore = s; try { localStorage.setItem("dinoHi", String(s)); } catch (e) {} }
    submitScore(s);
  }
  function frame(now) {
    raf = requestAnimationFrame(frame);
    var dt = Math.min(now - (time || now), 100);
    time = now;
    ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);

    if (state === "running") {
      runningTime += dt;
      if (speed < CFG.MAX_SPEED) speed = Math.min(CFG.MAX_SPEED, speed + CFG.ACCELERATION * dt / MS_PER_FRAME);
      distance += speed * dt / MS_PER_FRAME;
      updateTrex(dt); updateScenery(dt); updateObstacles(dt);
      if (collided()) crash();
    } else if (state === "waiting") {
      updateTrex(dt);
    }

    drawScenery();
    obstacles.forEach(drawObstacle);
    drawTrex(state === "crashed");
    drawScore();
    if (state === "waiting") drawCenter("스페이스 / 클릭으로 시작", 60, 14);
    if (state === "crashed") { drawCenter("G A M E   O V E R", 60, 16); drawCenter("↻ 스페이스 / 클릭으로 다시 시작", 82, 12); }
  }

  // ---- 입력 ----
  function press() {
    if (state === "waiting") { state = "running"; startJump(); }
    else if (state === "running") startJump();
    else if (state === "crashed" && time - gameOverAt > CFG.GAMEOVER_CLEAR_TIME) { reset(); state = "running"; lastMilestone = 0; startJump(); }
  }
  function down(on) {
    if (state !== "running") return;
    if (on) { if (trex.jumping) { trex.speedDrop = true; trex.v = 1; } else trex.ducking = true; }
    else { trex.ducking = false; trex.speedDrop = false; }
  }
  document.addEventListener("keydown", function (e) {
    if (e.target === nickEl || (e.target && e.target.tagName === "BUTTON")) return;  // 닉네임 입력·테마 버튼 조작 중에는 게임 키를 가로채지 않는다.
    if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); if (!e.repeat) press(); }
    else if (e.code === "ArrowDown") { e.preventDefault(); down(true); }
  });
  document.addEventListener("keyup", function (e) { if (e.code === "ArrowDown") down(false); });
  canvas.addEventListener("pointerdown", function (e) { e.preventDefault(); canvas.focus(); press(); });
  document.addEventListener("visibilitychange", function () { if (document.hidden && state === "running") state = "waiting"; });

  reset();
  raf = requestAnimationFrame(frame);

  // 테스트용 훅 (브라우저 콘솔 / 자동 검증에서 사용)
  window.__dino = { get state() { return state; }, get speed() { return speed; }, get score() { return score(); }, get obstacles() { return obstacles; }, get trexY() { return trex.y; }, press: press };
})();
</script>
</body>
</html>
